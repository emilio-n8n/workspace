# Workspace — PostgreSQL de développement
#
# Pour les développeurs qui préfèrent Docker au PostgreSQL natif.
# Port 5433 pour ne pas entrer en conflit avec une instance locale.
#
#   docker compose -f infrastructure/docker/docker-compose.dev.yml up -d
#   DATABASE_URL=postgres://workspace:workspace@127.0.0.1:5433/workspace_dev \
#   TEST_DATABASE_URL=postgres://workspace:workspace@127.0.0.1:5433/workspace_test \
#   pnpm --filter @workspace/database db:migrate

services:
  postgres:
    image: postgres:18
    container_name: workspace-postgres-dev
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace
      POSTGRES_DB: workspace_dev
    ports:
      - "5433:5432"
    volumes:
      - workspace-postgres-dev:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  workspace-postgres-dev:
